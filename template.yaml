AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Daily GitHub Explorer Agent
  
  Fetches a trending GitHub repo every day, uses Bedrock to summarize it, and hosts it on an S3 static website.

Resources:
  # S3 Bucket for hosting the static website
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # Bucket Policy to allow public read access to the website
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*

  # Lambda function
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref WebsiteBucket
          TELEGRAM_BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
          TELEGRAM_CHAT_ID: "YOUR_TELEGRAM_CHAT_ID_HERE"
      Policies:
        # Give Lambda permission to write to our S3 bucket
        - S3CrudPolicy:
            BucketName: !Ref WebsiteBucket
        # Give Lambda permission to invoke Bedrock models
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        # EventBridge rule to trigger daily at 6:00 AM UTC
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Name: DailyGitHubExplorerTrigger
            Description: Triggers the GitHub Explorer agent every morning

Outputs:
  WebsiteURL:
    Description: URL for the static website
    Value: !GetAtt WebsiteBucket.WebsiteURL
  AgentFunctionArn:
    Description: Daily GitHub Explorer Agent Lambda Function ARN
    Value: !GetAtt AgentFunction.Arn
